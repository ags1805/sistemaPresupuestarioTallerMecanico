<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Prototipo UX NAFER: gestión de vehículos, talleres, turnos y presupuestos." />
  <title>NAFER | Gestión de flotas y talleres · UX v1.2</title>
  <link rel="icon" type="image/png" href="assets/logo-nafer.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand" aria-label="NAFER, Gestión de Talleres">
        <span class="brand-logo-frame"><img class="brand-logo" src="assets/logo-nafer.png" alt="Logo NAFER" width="176" height="81" /></span>
        <span class="brand-text">GESTIÓN DE VEHÍCULOS Y TALLERES</span>
      </div>
      <div class="sidebar-label" id="role-label">PORTAL DEL CLIENTE</div>
      <nav id="side-nav" class="side-nav" aria-label="Navegación principal"></nav>
      <div class="sidebar-footer"><span class="status-dot"></span>Prototipo UX v1.2<br /><small>Datos de demostración · Sin autenticación real</small></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left"><button type="button" class="mobile-toggle" id="toggle-menu" aria-label="Abrir menú">☰</button><span class="eyebrow" id="location-crumb">Mi espacio</span></div>
        <div class="topbar-right">
          <label for="role-switch" class="switch-label">Simular usuario</label>
          <select id="role-switch" class="role-select" aria-label="Cambiar usuario de demostración"></select>
          <span class="avatar" title="NAFER"><img src="assets/logo-nafer.png" alt="NAFER" width="52" height="24" /></span>
        </div>
      </header>
      <main class="main-content" id="screen" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <footer class="demo-footer"><span>NAFER · UX v1.2 · Recorrido con Cliente, Taller y Administración</span><button id="reset-demo" type="button" class="text-button">Restablecer demostración</button></footer>
</body>
</html>
